<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Preloader PRO</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffffff;
    overflow:hidden;
}

/* CONTENEDOR GENERAL (YA NO TIENE ZOOM) */
.loader{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* CONTENEDOR SOLO DEL LOGO */
.logo{
    animation: zoomIn 2s ease forwards;
}

/* SVG */
svg{
    width:220px;
}

/* PATHS */
path{
    fill:none;
    stroke:#e20a0a;
    stroke-width:0.8;

    stroke-dasharray:1000;
    stroke-dashoffset:1000;

    filter: drop-shadow(0 0 8px #2e2a2a00);

    animation: draw 2s ease forwards;
}

/* DIBUJO */
@keyframes draw{
    to{
        stroke-dashoffset:0;
    }
}

/* ZOOM SOLO PARA EL LOGO */
@keyframes zoomIn{
    0%{
        transform:scale(0.6);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* TEXTO */
.loader-text{
    margin-top:20px;
    font-family:Arial;
    font-size:14px;
    letter-spacing:3px;
    color:#e20a0a;
}

/* BARRA (YA NO SE MUEVE) */
.progress{
    margin-top:15px;
    width:180px;
    height:4px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#e20a0a;
    box-shadow:0 0 10px #e20a0a;

    animation: loading 3s ease forwards;
}

/* CARGA */
@keyframes loading{
    from{ width:0%; }
    to{ width:100%; }
}
</style>
</head>
